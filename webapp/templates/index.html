<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Arduino Oven Controller</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">

<h1 class="title">Arduino Oven Controller</h1>

<div class="card">
<h2>Connection</h2>

<select id="port">
{% for p in ports %}
<option {% if p==default_port %}selected{% endif %}>{{p}}</option>
{% endfor %}
</select>

<input type="number" id="baudrate" value="{{ default_baudrate }}" step="1" min="300" max="1000000">

<button id="connectBtn">Connect</button>

<div id="status" class="status disconnected">Disconnected</div>
</div>

<!-- Quick Commands -->
<div class="card">
<h2>Quick Commands</h2>
<div class="button-grid">
<button data-cmd="0,1">Start Run</button>
<button data-cmd="0,0">Stop Run</button>
<button data-cmd="14,1">Read Temperature</button>
<button data-cmd="13,1">Read Voltages</button>
<button data-cmd="11,1">Read Settings</button>
<button data-cmd="15,1">Debug ON</button>
<button data-cmd="15,0">Debug OFF</button>
</div>
</div>

<!-- Manual command -->
<div class="card">
<h2>Manual Command</h2>
<div class="manual">
<input id="cmdInput" placeholder="example: 1,60">
<button id="sendBtn">Send</button>
</div>
</div>

<!-- Console -->
<div class="card">
<h2>Console</h2>
<div id="console"></div>
</div>

<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
